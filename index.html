<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習場所チェックイン</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; background-color: #fafafa;}
    h1 { font-size: 24px; color: #333; text-align: center; }
    .input-area { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #555; }
    input { padding: 12px; font-size: 16px; width: 100%; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .button-group { display: flex; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 12px 0; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; }
    .btn-toyonaka { background: #4CAF50; color: white; }
    .btn-suita { background: #2196F3; color: white; }
    .btn-leave { background: #f44336; color: white; width: 100%; margin-top: 10px; }
    button:active { opacity: 0.8; transform: translateY(2px); }
    
    .campus-card { background: #fff; border-left: 5px solid #ddd; padding: 15px 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .card-toyonaka { border-left-color: #4CAF50; }
    .card-suita { border-left-color: #2196F3; }
    .campus-card h2 { margin-top: 0; font-size: 18px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    ul { list-style-type: none; padding-left: 0; margin: 0; }
    li { background: #f9f9f9; margin: 8px 0 0; padding: 12px; border-radius: 6px; line-height: 1.4; display: flex; flex-direction: column; }
    .name-time-row { display: flex; justify-content: space-between; align-items: baseline; }
    .member-name { font-weight: bold; font-size: 16px; color: #222; }
    .time-text { font-size: 12px; color: #888; }
    .memo-text { font-size: 14px; color: #555; margin-top: 6px; background: #eef; padding: 6px 10px; border-radius: 4px; display: inline-block; }
  </style>
</head>
<body>
  <h1>📍 練習場所チェックイン</h1>
  
  <div class="input-area">
    <div class="input-group">
      <label for="username">👤 あなたの名前</label>
      <input type="text" id="username" placeholder="例: 阪大 太郎">
    </div>
    <div class="input-group">
      <label for="usermemo">💬 ひとことメモ（任意）</label>
      <input type="text" id="usermemo" placeholder="例: 4限授業あります / 夜までいます">
    </div>
    
    <div class="button-group">
      <button class="btn-toyonaka" id="btn-toyonaka">豊中に来た</button>
      <button class="btn-suita" id="btn-suita">吹田に来た</button>
    </div>
    <button class="btn-leave" id="btn-leave">帰る</button>
  </div>

  <div class="campus-card card-toyonaka">
    <h2>豊中キャンパス（<span id="count-toyonaka">0</span>人）</h2>
    <ul id="list-toyonaka"></ul>
  </div>

  <div class="campus-card card-suita">
    <h2>吹田キャンパス（<span id="count-suita">0</span>人）</h2>
    <ul id="list-suita"></ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyAbb-HSEJp1LHNli-4xFzslP9CScw5KNuA",
      authDomain: "patiocheckin-b3859.firebaseapp.com",
      projectId: "patiocheckin-b3859",
      storageBucket: "patiocheckin-b3859.firebasestorage.app",
      messagingSenderId: "968861594943",
      appId: "1:968861594943:web:48e50fb1bd68565b988f8a",
      measurementId: "G-VRK16M8ML5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const nameInput = document.getElementById('username');
    const memoInput = document.getElementById('usermemo');

    // ★便利機能：前回入力した名前を復元する
    const savedName = localStorage.getItem('checkin_username');
    if(savedName) {
      nameInput.value = savedName;
    }

    // 更新処理
    async function updateStatus(location) {
      const name = nameInput.value.trim();
      const memo = memoInput.value.trim();

      if (!name) { 
        alert("名前を入力してください！"); 
        return; 
      }
      
      // ★便利機能：名前をブラウザに保存する
      localStorage.setItem('checkin_username', name);
      
      try {
        await setDoc(doc(db, "members", name), {
          name: name,
          memo: memo,
          location: location,
          updatedAt: new Date().toISOString()
        });
        
        // 処理成功後、入力欄のメモだけをクリアする（名前は残す）
        memoInput.value = '';
        
      } catch (error) {
        console.error("エラーが発生しました: ", error);
        alert("データの保存に失敗しました。Firebaseのルール設定を確認してください。");
      }
    }

    document.getElementById('btn-toyonaka').addEventListener('click', () => updateStatus('toyonaka'));
    document.getElementById('btn-suita').addEventListener('click', () => updateStatus('suita'));
    document.getElementById('btn-leave').addEventListener('click', () => updateStatus('none'));

    // リアルタイム表示処理
    onSnapshot(collection(db, "members"), (snapshot) => {
      const listToyonaka = document.getElementById('list-toyonaka');
      const listSuita = document.getElementById('list-suita');
      listToyonaka.innerHTML = ''; 
      listSuita.innerHTML = '';
      
      let tCount = 0, sCount = 0;

      const todayZero = new Date();
      todayZero.setHours(0, 0, 0, 0);

      snapshot.forEach((doc) => {
        const data = doc.data();
        const updatedAt = new Date(data.updatedAt);

        // 0時リセット：今日の0時より前のデータは無視
        if (updatedAt < todayZero) return;

        const timeString = `${updatedAt.getHours()}:${String(updatedAt.getMinutes()).padStart(2, '0')}`;
        
        const li = document.createElement('li');
        
        // メモがある場合とない場合で表示を分ける
        let htmlContent = `
          <div class="name-time-row">
            <span class="member-name">${data.name}</span>
            <span class="time-text">${timeString} 更新</span>
          </div>
        `;
        if (data.memo) {
          htmlContent += `<div class="memo-text">${data.memo}</div>`;
        }
        
        li.innerHTML = htmlContent;

        if (data.location === 'toyonaka') {
          listToyonaka.appendChild(li);
          tCount++;
        } else if (data.location === 'suita') {
          listSuita.appendChild(li);
          sCount++;
        }
      });

      document.getElementById('count-toyonaka').textContent = tCount;
      document.getElementById('count-suita').textContent = sCount;
    });
  </script>
</body>
</html>
